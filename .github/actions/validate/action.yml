name: 'Horizon Ledger Validate'
description: 'Validate a local Horizon decision ledger in CI'
branding:
  icon: 'book-open'
  color: 'blue'
inputs:
  root:
    description: 'Repository root containing .horizon or workspace'
    required: false
    default: '.'
  strict:
    description: 'Fail on warnings as well as errors'
    required: false
    default: 'true'
  workspace:
    description: 'Use Horizon workspace aggregation for monorepo roots'
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
    - name: Install Horizon Ledger
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install --frozen-lockfile
    - name: Validate decisions
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ROOT: ${{ inputs.root }}
      run: |
        set -euo pipefail
        if [[ "${{ inputs.workspace }}" == "true" ]]; then
          bun run "$ACTION_PATH/src/cli/index.ts" workspace validate --strict --root "$ROOT"
        else
          bun run "$ACTION_PATH/src/cli/index.ts" validate --strict --root "$ROOT"
        fi
