name: 'Horizon Ledger Validate'
description: 'Validate a local Horizon decision ledger in CI'
branding:
  icon: 'book-open'
  color: 'blue'
inputs:
  root:
    description: 'Repository root containing .horizon'
    required: false
    default: '.'
  strict:
    description: 'Fail on warnings as well as errors'
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
    - name: Install Horizon Ledger
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install --frozen-lockfile
    - name: Validate decisions
      shell: bash
      run: bun run "${{ github.action_path }}/src/cli/index.ts" validate ${{ inputs.strict == 'true' && '--strict' || '' }} --root "${{ inputs.root }}"
